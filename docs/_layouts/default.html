<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>
      {% if page.title %}
        {{ page.title }} / {{ site.title | default: "NYMesh" }}
      {% else %}
        {{ site.title | default: "NYMesh" }}
      {% endif %}
    </title>
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=albert-sans:400,400i,700,700i" rel="stylesheet" />
    {% include css-reset.html %}
    {% include css-critical.html %}
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <!-- https://edezekiel.medium.com/css-only-responsive-navigation-menu-c36ad02751e8 -->
    <nav>
      <div class="collapsible-nav">
        <!-- This checkbox will give us the toggle behavior, it will be hidden, but functional -->
        <input type="checkbox" id="main-menu-toggle" class="menu-toggle-input" />
        <label for="main-menu-toggle" class="menu-toggle" aria-label="Toggle menu">&#9776;</label>
        <div class="nav-links">
          <a class="logo-link" href="/">
            <img class="nav-logo" src="/images/logo-256.png">
          </a>
          <a href="/">Home</a>
          <a href="/getting-started/">Getting Started</a>
          <a class="nav-subitem" href="/getting-started/#meshtastic">Meshtastic</a>
          <a class="nav-subitem" href="/getting-started/#meshcore">MeshCore</a>
          <!-- <hr />
          <a href="/node_configuration/">Config</a>
          <a href="/node_configuration_adv/">Advanced Config</a>
          <a href="/build_resources/">Builds</a> -->
          <hr />
          <a href="/faq/">FAQ</a>
          <a href="/glossary/">Glossary</a>
          <hr />
          <!-- Network icons: selfh.st/icons, CC BY 4.0 (see /images/icons/ATTRIBUTION.md) -->
          <a class="nav-service" href="https://discord.nyme.sh"><span>Discord</span><span class="nav-tags"><img class="nav-icon" src="/images/icons/meshtastic.svg" alt="Meshtastic" title="Meshtastic"><img class="nav-icon" src="/images/icons/meshcore.svg" alt="MeshCore" title="MeshCore"></span></a>
          <a class="nav-service" href="https://meshview.nyme.sh"><span>Meshview</span><span class="nav-tags"><img class="nav-icon" src="/images/icons/meshtastic.svg" alt="Meshtastic" title="Meshtastic"></span></a>
          <a class="nav-service" href="https://malla.nyme.sh"><span>Malla</span><span class="nav-tags"><img class="nav-icon" src="/images/icons/meshtastic.svg" alt="Meshtastic" title="Meshtastic"></span></a>
          <a class="nav-service" href="https://coverage.nyme.sh"><span>Coverage</span><span class="nav-tags"><img class="nav-icon" src="/images/icons/meshtastic.svg" alt="Meshtastic" title="Meshtastic"></span></a>
          <a class="nav-service" href="https://nyc.meshmapper.net" target="_blank" rel="noopener"><span>MeshMapper<span class="nav-ext" title="External site, not run by NYMesh" aria-label="external site">&#8599;</span></span><span class="nav-tags"><img class="nav-icon" src="/images/icons/meshcore.svg" alt="MeshCore" title="MeshCore"></span></a>
        </div>
      </div>
    </nav>
    <main>
      {{ content }}
    </main>
    <div id="accent"></div>
    <script>
      Array.from(document.querySelectorAll('h1, h2, h3, h4, h5, h6')).forEach(el => {
        const a = document.createElement('a');
        a.href = `#${ el.id }`;
        a.textContent = '#';
        a.classList.add('deeplink');
        el.appendChild(a);
        el.classList.add('has-deeplink');
      });
    </script>
  </body>
</html>
